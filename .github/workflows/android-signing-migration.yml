name: Android signing migration
on:
  push:
    branches: [main]
    paths: ['scripts/android-migration-recipient.json', 'docs/android-signing-verification.json']
  workflow_dispatch:
    inputs:
      operation:
        description: Verify repository secrets and remove the legacy key cache, or recover an encrypted backup
        type: choice
        options: [verify-and-purge, recover]
        default: verify-and-purge
permissions:
  contents: read
concurrency:
  group: android-signing-migration
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'n3me5is-git/chatbox-venice' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'SIGNING:')) || inputs.operation == 'recover')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-${{ github.repository_id }}
          fail-on-cache-miss: true
      - name: Encrypt the existing identity for its local recovery recipient
        run: node scripts/android-signing-migration.mjs recover
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-migration-encrypted
          path: release/signing-migration/*.encrypted.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove restored private key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
  verify-and-purge:
    if: github.repository == 'n3me5is-git/chatbox-venice' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-and-purge') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'SIGNING:')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the secret contains the original private key and certificate
        env:
          ANDROID_SIGNING_IDENTITY: ${{ secrets.ANDROID_SIGNING_IDENTITY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing-migration.mjs verify
      - name: Remove legacy signing caches only after secrets verification succeeds
        uses: actions/github-script@v7
        with:
          script: |
            const key = 'android-debug-keystore-${{ github.repository_id }}';
            let deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.getActionsCacheList({ ...context.repo, key, per_page: 100 });
              const caches = data.actions_caches.filter(cache => cache.key === key);
              if (!caches.length) break;
              for (const cache of caches) { await github.rest.actions.deleteActionsCacheById({ ...context.repo, cache_id: cache.id }); deleted++; }
              if (deleted > 1000) throw new Error('Unexpected cache count');
            }
            await core.summary.addRaw('Signing secrets match the pinned Android identity. The legacy keystore cache has been removed. New APKs use repository secrets only.').write();

