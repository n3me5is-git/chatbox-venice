name: Native security checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'scripts/configure-fork-android.mjs', 'scripts/build-windows-security.ps1', '.github/workflows/native-security.yml']
  pull_request:
    paths: ['native/**', 'scripts/configure-fork-android.mjs', 'scripts/build-windows-security.ps1', '.github/workflows/native-security.yml']
permissions:
  contents: read
concurrency:
  group: native-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Compile Windows Hello desktop integration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-windows-security.ps1
      - name: Probe API availability without requesting authentication
        run: |
          $result=& ./release/app/dist/native/windows/vault-consent.exe --check
          if ($LASTEXITCODE -ne 0 -or $result -notmatch '^\d+$') { throw 'Invalid Windows Hello API probe' }
          Write-Host 'Windows Hello helper responded; device enrollment is not expected on a hosted runner.'
  android:
    name: Compile Android Keystore and biometric plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare minimal renderer fixture for native compilation
        run: node --input-type=module -e "import fs from 'node:fs'; fs.mkdirSync('release/app/dist/renderer',{recursive:true}); fs.writeFileSync('release/app/dist/renderer/index.html','<!doctype html><title>Native compilation fixture</title>')"
      - run: pnpm exec cap add android
      - run: node scripts/configure-fork-android.mjs
      - run: pnpm exec cap sync android
      - name: Compile Java without packaging or signing an APK
        run: chmod +x android/gradlew && cd android && ./gradlew :app:compileReleaseJavaWithJavac --no-daemon
  android-device:
    name: Android Keystore, camera and WebRTC runtime (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare native test fixture
        run: |
          mkdir -p release/app/dist/renderer
          echo '<!doctype html><title>Keystore runtime tests</title>' > release/app/dist/renderer/index.html
          pnpm exec cap add android
          node scripts/configure-fork-android.mjs
          pnpm exec cap sync android
          mkdir -p android/app/src/androidTest/java/io/github/n3me5is/chatboxvenice
          cp native/android/test/VaultKeyDeviceTest.java android/app/src/androidTest/java/io/github/n3me5is/chatboxvenice/
          cp native/android/test/MicrophoneDeviceTest.java android/app/src/androidTest/java/io/github/n3me5is/chatboxvenice/
          cp native/android/test/CollaborationDeviceTest.java android/app/src/androidTest/java/io/github/n3me5is/chatboxvenice/
          chmod +x android/gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell locksettings set-pin 123456
            adb shell input keyevent 224
            adb shell input swipe 500 1600 500 300 400
            adb shell input text 123456
            adb shell input keyevent 66
            adb shell wm dismiss-keyguard
            cd android && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.n3me5is.chatboxvenice.VaultKeyDeviceTest,io.github.n3me5is.chatboxvenice.MicrophoneDeviceTest,io.github.n3me5is.chatboxvenice.CollaborationDeviceTest --no-daemon
      - name: Save Android device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Keystore-API-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: warn
