name: Sync release notes
on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md', '.github/workflows/release-notes.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-fork-release
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update published notes from current English source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner:context.repo.owner,repo:context.repo.repo}
            const {data:files}=await github.rest.repos.getContent({...repo,path:'docs/releases',ref:'main'})
            for(const file of files.filter(f=>/^v\d+\.\d+\.\d+\.md$/.test(f.name))) {
              const tag=file.name.slice(0,-3)
              let release
              try { release=(await github.rest.repos.getReleaseByTag({...repo,tag})).data }
              catch(error) { if(error.status===404) continue; throw error }
              if(release.draft) continue
              const {data:source}=await github.rest.repos.getContent({...repo,path:file.path,ref:'main'})
              const body=Buffer.from(source.content,'base64').toString('utf8')
              if(release.body!==body) {
                await github.rest.repos.updateRelease({...repo,release_id:release.id,body})
                core.info('Updated '+tag+' notes; packages and tags unchanged')
              }
            }
