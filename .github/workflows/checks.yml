name: Checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test suite
        type: choice
        options: [focused, unit, ui]
        default: focused
  workflow_call:
    inputs:
      test_scope:
        type: string
        default: focused
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  verify:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Windows packaging configuration
        run: node scripts/package-fork.cjs --check-config
      - run: pnpm check
      - name: Build optional live-test driver without credentials
        run: node scripts/build-venice-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Venice-live-smoke-driver
          path: test-results/venice-live/
          retention-days: 7
          overwrite: true
      - name: Test vendor options, Venice, references and privacy
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/shared/session-workspace-execution.test.ts src/renderer/packages/mobile-work-mode/runtime-memory.test.ts src/renderer/stores/session/__tests__/tools-builder.test.ts src/renderer/presentation/session/session-ui-effects.test.ts src/shared/session-resources.test.ts src/shared/session-file-store.test.ts src/main/sandbox/session-files.test.ts packages/chatbox-core/src/domain/settings/venice-privacy.test.ts packages/chatbox-core/src/application/session/SessionNamingService.test.ts packages/chatbox-core/src/generation/GenerationService.test.ts src/shared/providers/definitions/models/venice/near-gateway.test.ts src/shared/providers/definitions/models/venice/image-processing.test.ts src/renderer/packages/venice/reference-crop.test.ts src/shared/providers/definitions/models/venice/pricing.test.ts src/shared/providers/definitions/models/venice/search-policy.test.ts src/shared/providers/definitions/models/venice/encrypted-tools.test.ts src/shared/providers/definitions/models/venice/secure-tool-roundtrip.test.ts src/shared/providers/definitions/models/venice/balance.test.ts src/renderer/packages/overlay-back.test.ts src/renderer/packages/local-text.test.ts src/renderer/packages/venice/image-edit.test.ts src/renderer/packages/vault/project-library.test.ts src/renderer/packages/vault/runtime.test.ts src/renderer/packages/voice-file.test.ts src/renderer/packages/image-thumbnail.test.ts src/renderer/packages/vault/media-records.test.ts src/renderer/packages/vault/project-access.test.ts src/renderer/adapters/backup-resources.test.ts src/main/vault-key.test.ts src/renderer/packages/vault/image-records.test.ts src/renderer/packages/vault/backup.test.ts src/renderer/packages/vault/chunk-store.test.ts src/renderer/packages/vault/database.test.ts src/renderer/packages/vault/keys.test.ts src/shared/providers/definitions/models/venice/voice.test.ts src/shared/providers/definitions/models/venice/crypto-signature.test.ts src/shared/providers/definitions/models/venice/tee-policy.test.ts src/shared/providers/definitions/models/venice/tee-quote.test.ts src/shared/providers/definitions/models/venice/secure-chat.test.ts src/shared/providers/definitions/models/venice/privacy.test.ts src/shared/providers/definitions/models/venice/sound-effects.test.ts src/renderer/packages/venice/session-approvals.test.ts packages/chatbox-i18n/src/resources.test.ts src/renderer/packages/web-search/venice.test.ts src/renderer/packages/venice/image-model-choice.test.ts src/shared/providers/definitions/models/venice/media-capabilities.test.ts src/shared/providers/definitions/models/venice/music-catalog.test.ts src/shared/providers/definitions/models/venice/reasoning.test.ts src/shared/providers/definitions/models/venice/image-tools.test.ts src/shared/providers/definitions/models/venice/internal-mcp.test.ts src/shared/utils/reasoning-control.test.ts src/renderer/utils/request.test.ts src/renderer/packages/image-model-catalog.test.ts src/renderer/hooks/useImageModelGroups.test.tsx src/shared/providers/definitions/models/venice/catalog.test.ts src/shared/providers/definitions/models/venice/media.test.ts src/shared/providers/definitions/models/venice/options.test.ts src/shared/providers/definitions/models/venice/tools.test.ts src/shared/models/utils/extra-body.test.ts src/shared/providers/definitions/models/venice.test.ts packages/chatbox-core/src/application/image-generation/catalog.test.ts packages/chatbox-core/src/application/image-generation/ImageGenerationService.test.ts packages/chatbox-core/src/domain/settings/fork-privacy-defaults.test.ts src/renderer/packages/context-management/summary-generator.test.ts src/renderer/components/Markdown.ssr.test.tsx src/renderer/components/message-parts/ToolCallPartUI.search-results.test.tsx packages/chatbox-core/src/domain/settings/settings-migrations.test.ts packages/chatbox-core/src/application/settings/SettingsService.test.ts packages/chatbox-core/src/backup-host/settings.test.ts src/renderer/stores/settingsStore.persist.test.ts src/renderer/adapters/RendererSettingsStorage.test.ts
      - name: Full unit test suite (optional)
        if: inputs.test_scope == 'unit'
        run: pnpm test:unit
      - name: Check private Android signing backup logic
        run: node --test scripts/android-signing.test.mjs scripts/android-signing-migration.test.mjs


  ui:
    name: Simulated UI and browser checks
    if: inputs.test_scope != 'unit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Simulated UI interactions and reference links
        run: pnpm exec vitest run src/renderer/components/Artifact.test.tsx src/renderer/components/session/SessionSidePanel.test.tsx src/renderer/components/session-resources/SessionResources.test.tsx src/renderer/components/session-resources/MarkdownFilePreview.test.tsx src/renderer/components/venice/VeniceChatPrivacySettings.test.tsx src/renderer/components/venice/SecureReceiptSettings.test.tsx src/renderer/components/venice/VeniceImageTools.test.tsx src/renderer/components/venice/VenicePricing.test.tsx src/renderer/components/InputBox/useModelToolCapabilities.test.tsx src/renderer/components/venice/VeniceSearchControl.test.tsx src/renderer/components/security/ProtectedPreviewGate.test.tsx src/renderer/components/common/AdaptiveModal.test.tsx src/renderer/components/security/CreationUnlock.test.tsx src/renderer/hooks/useInputBoxHistory.privacy.test.tsx src/renderer/routes/image-creator/-components/HistoryItem.test.tsx src/renderer/components/security/ProjectGate.test.tsx src/renderer/components/security/ScopeUnlock.test.tsx src/renderer/packages/local-library.test.ts src/renderer/components/session/SessionItem.test.tsx src/renderer/stores/session/crud.test.ts src/renderer/components/venice/VeniceMediaApproval.test.tsx src/renderer/components/venice/VeniceSessionApprovals.test.tsx src/renderer/components/venice/VeniceLocalization.test.tsx src/renderer/components/settings/provider/VeniceProfiles.test.tsx src/renderer/modals/ModelEdit.venice.test.tsx src/renderer/components/ImageModelSelect.test.tsx src/renderer/components/InputBox/AgentModePanel.test.tsx src/renderer/components/InputBox/MobileAgentModePanel.test.tsx src/renderer/components/venice/VeniceStudio.test.tsx src/renderer/components/venice/VeniceRecorder.test.tsx src/renderer/components/venice/VeniceImageApproval.test.tsx src/renderer/components/Markdown.ssr.test.tsx src/renderer/components/message-parts/ToolCallPartUI.search-results.test.tsx
      - name: Browser simulation with desktop and phone screenshots
        run: node scripts/ui-simulation/run.mjs
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Venice-UI-simulation
          path: test-results/venice-ui/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
