name: Checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test suite
        type: choice
        options: [focused, unit]
        default: focused
  workflow_call:
    inputs:
      test_scope:
        type: string
        default: focused
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  verify:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Windows packaging configuration
        run: node scripts/package-fork.cjs --check-config
      - name: Test vendor options, Venice, references and privacy
        if: inputs.test_scope != 'unit'
        run: pnpm exec vitest run src/shared/models/utils/extra-body.test.ts src/shared/providers/definitions/models/venice.test.ts packages/chatbox-core/src/application/image-generation/catalog.test.ts packages/chatbox-core/src/application/image-generation/ImageGenerationService.test.ts packages/chatbox-core/src/domain/settings/fork-privacy-defaults.test.ts src/renderer/packages/context-management/summary-generator.test.ts src/renderer/components/Markdown.ssr.test.tsx src/renderer/components/message-parts/ToolCallPartUI.search-results.test.tsx
      - name: Full unit test suite (optional)
        if: inputs.test_scope == 'unit'
        run: pnpm test:unit
      - run: pnpm check

