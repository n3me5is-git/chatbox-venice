name: Checks
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Test suite
        type: choice
        options: [focused, unit, ui]
        default: focused
  workflow_call:
    inputs:
      test_scope:
        type: string
        default: focused
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  verify:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Concise user-facing release notes
        run: node --test scripts/release-notes-policy.test.mjs
      - name: Independent desktop MCP endpoints and global router boundaries
        run: pnpm exec vitest run src/renderer/packages/multi-agent/storage.test.ts src/shared/local-mcp-model-policy.test.ts src/renderer/packages/local-mcp/conversation.test.ts src/renderer/packages/local-mcp/studio.test.ts src/renderer/packages/local-mcp/transfer.test.ts src/main/local-mcp/registry.test.ts src/renderer/packages/local-mcp/application.test.ts src/renderer/packages/local-mcp/model-input.test.ts src/renderer/components/session-resources/ApplicationMCPSettings.test.tsx
      - name: Fork tool reliability, navigation and model-aware Studio controls
        run: pnpm exec vitest run packages/chatbox-core/src/mcp/tool-names.test.ts src/renderer/packages/mcp/controller.test.ts packages/chatbox-core/src/generation/GenerationService.test.ts packages/chatbox-core/src/generation/BasicGenerationPreparation.test.ts packages/chatbox-core/src/generation/generation-lock.test.ts packages/chatbox-core/src/application/chat/ChatMessageService.test.ts src/shared/context/message-eligibility.test.ts src/shared/models/responses-tool-defaults.test.ts src/shared/models/utils/openai-tool-delta.test.ts src/shared/models/utils/openai-chat-sse-termination.test.ts src/shared/providers/definitions/glm-native-network.test.ts src/renderer/hooks/useSingleFlightAction.test.tsx src/renderer/stores/session/generation-locking.test.ts src/renderer/stores/atoms/sessionAtoms.test.ts src/renderer/components/session/SessionList.test.tsx src/renderer/components/settings/provider/VeniceImageSettings.test.tsx src/renderer/components/venice/VeniceStudio.test.tsx src/shared/providers/definitions/models/venice/studio-capabilities.test.ts
      - name: Image reference routing, library reuse and picker actions
        run: pnpm exec vitest run src/shared/providers/definitions/models/venice/image-reference-model.test.ts src/renderer/hooks/useReferenceModelSelection.test.tsx src/renderer/components/venice/ReferenceModelControl.test.tsx src/renderer/packages/local-image-reference.test.ts src/renderer/routes/image-creator/-hooks/useReferenceImageDraft.test.ts src/renderer/components/local-library/LocalMediaBrowser.test.tsx src/renderer/components/venice/VeniceImageApproval.test.tsx src/shared/providers/definitions/openai-subscription.test.ts
      - name: Encrypted archive relocation, recovery and row-store compatibility
        run: pnpm exec vitest run src/renderer/packages/archive-storage src/main/archive-storage.test.ts src/renderer/components/settings/ArchiveStorage.test.tsx
      - name: Session RAG, linked folders and extraction boundaries
        run: pnpm exec vitest run src/shared/session-rag-policy.test.ts src/renderer/packages/session-resources/linked-folder.test.ts src/shared/session-rag-engine.test.ts src/main/sandbox/linked-folder.test.ts src/renderer/packages/session-rag src/renderer/components/session-resources/SessionRag.test.tsx
      - name: Portable encrypted knowledge collections and document parsing
        run: pnpm exec vitest run src/shared/rag-chunker.test.ts src/shared/mobile-work/worker/extended-documents.test.ts src/renderer/packages/knowledge-collections src/renderer/components/knowledge-base/CollectionsPage.test.tsx
      - name: Validate Windows packaging configuration
        run: node scripts/package-fork.cjs --check-config
      - run: pnpm check
        if: ${{ !cancelled() }}
      - name: Remote chat controls, inline mentions and subscription image/search regressions
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/renderer/packages/collaboration/controls.test.ts src/renderer/packages/collaboration/projection.test.ts src/renderer/packages/collaboration/hub.test.ts src/renderer/packages/prompt-mentions src/shared/prompt-mentions.test.ts src/shared/oauth/chatgpt-search-replay.test.ts src/shared/providers/definitions/openai-subscription-replay.test.ts src/shared/providers/definitions/models/venice/tool-policy.test.ts src/renderer/packages/chatgpt-subscription/image-tools.test.ts src/renderer/components/InputBox/MessageInputField.test.tsx src/renderer/components/collaboration/RemoteChat.test.tsx src/renderer/components/session/SessionList.test.tsx src/renderer/components/venice/SessionVeniceTools.test.tsx
      - name: Android Work tool parity, native image capabilities and resumed calls
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/renderer/packages/mobile-work-mode/runtime-parity.test.ts src/renderer/packages/mobile-work-mode/runtime-memory.test.ts src/shared/mobile-work/product-info-tools.test.ts src/shared/mobile-work/builtin-skills.test.ts src/renderer/packages/chatgpt-subscription/image-tools.test.ts
      - name: Subscription login, catalog, native search and image endpoint routes
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/shared/oauth/chatgpt-model-catalog.test.ts src/shared/oauth/chatgpt-subscription.test.ts src/shared/oauth/chatgpt-search-sources.test.ts src/shared/providers/definitions/openai-subscription.test.ts src/renderer/packages/chatgpt-subscription src/renderer/utils/mobile-request.test.ts src/renderer/components/settings/provider/ChatGPTSubscription.test.tsx src/renderer/components/settings/provider/SubscriptionSessionSearch.test.tsx src/renderer/components/icons/ProviderBranding.test.tsx src/renderer/modals/ModelEdit.subscription.test.tsx
      - name: Direct transfer integrity, admission and subscription allowance
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/shared/session-transfer.test.ts src/renderer/packages/session-transfer src/shared/oauth/chatgpt-allowance.test.ts src/renderer/packages/chatgpt-subscription/service.test.ts src/renderer/components/settings/provider/ChatGPTAllowance.test.tsx src/renderer/components/collaboration/DirectTransfer.test.tsx
      - name: Context budgets, manual compression and generation boundaries
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/renderer/components/common/ContextTokenBudgetField.test.tsx src/renderer/components/InputBox/TokenCountMenu.test.tsx src/renderer/components/multi-agent/AgentParameters.test.tsx src/renderer/components/multi-agent/AgentCallingDetails.test.tsx src/renderer/components/session/SessionSettingsContent.test.tsx src/renderer/packages/multi-agent/context.test.ts src/renderer/packages/multi-agent/context-sdk.test.ts src/renderer/packages/multi-agent/worker-context.test.ts src/renderer/packages/context-management/context-token-limit.test.ts src/renderer/packages/context-management/context-pressure.test.ts src/renderer/packages/context-management/compaction-detector.test.ts src/renderer/packages/context-management/compaction.test.ts packages/chatbox-core/src/application/token-estimation/math.test.ts packages/chatbox-core/src/generation/mid-run-compaction.test.ts packages/chatbox-core/src/generation/mid-run-compaction-media.test.ts
      - name: Protection history persistence and background lock timeout
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run packages/chatbox-react/src/image-generation-hooks.test.ts src/renderer/storage/__tests__/SQLiteImageGenerationStorage.test.ts src/renderer/packages/vault/background-lock.test.ts src/renderer/packages/vault/image-records.test.ts src/renderer/packages/vault/media-records.test.ts
      - name: Media wait and chat artifact boundaries
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/shared/providers/definitions/models/venice/media-wait.test.ts src/shared/providers/definitions/models/venice/tools.test.ts src/renderer/packages/venice/media-artifacts.test.ts src/renderer/components/venice/VeniceMediaArtifacts.test.tsx
      - name: Build optional live-test driver without credentials
        run: node scripts/build-venice-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Venice-live-smoke-driver
          path: test-results/venice-live/
          retention-days: 7
          overwrite: true
      - name: Test vendor options, Venice, references and privacy
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/shared/local-mcp-redaction.test.ts src/shared/local-mcp.test.ts src/main/local-mcp/server.test.ts src/main/local-mcp/ipc.test.ts src/renderer/packages/local-mcp/backend.test.ts src/shared/python-runtime.test.ts src/renderer/packages/session-resources/backup.test.ts src/shared/session-workspace-execution.test.ts src/renderer/packages/mobile-work-mode/runtime-memory.test.ts src/renderer/stores/session/__tests__/tools-builder.test.ts src/renderer/presentation/session/session-ui-effects.test.ts src/shared/session-resources.test.ts src/shared/session-file-store.test.ts src/main/sandbox/session-files.test.ts packages/chatbox-core/src/domain/settings/venice-privacy.test.ts packages/chatbox-core/src/application/session/SessionNamingService.test.ts packages/chatbox-core/src/generation/GenerationService.test.ts src/shared/providers/definitions/models/venice/near-gateway.test.ts src/shared/providers/definitions/models/venice/image-processing.test.ts src/renderer/packages/venice/reference-crop.test.ts src/shared/providers/definitions/models/venice/pricing.test.ts src/shared/providers/definitions/models/venice/search-policy.test.ts src/shared/providers/definitions/models/venice/encrypted-tools.test.ts src/shared/providers/definitions/models/venice/secure-tool-roundtrip.test.ts src/shared/providers/definitions/models/venice/balance.test.ts src/renderer/packages/overlay-back.test.ts src/renderer/packages/local-text.test.ts src/renderer/packages/venice/image-edit.test.ts src/renderer/packages/vault/project-library.test.ts src/renderer/packages/vault/runtime.test.ts src/renderer/packages/voice-file.test.ts src/renderer/packages/video-file.test.ts src/renderer/packages/image-thumbnail.test.ts src/renderer/packages/vault/media-records.test.ts src/renderer/packages/vault/project-access.test.ts src/renderer/adapters/backup-resources.test.ts src/main/vault-key.test.ts src/renderer/packages/vault/image-records.test.ts src/renderer/packages/vault/backup.test.ts src/renderer/packages/vault/chunk-store.test.ts src/renderer/packages/vault/database.test.ts src/renderer/packages/vault/keys.test.ts src/shared/providers/definitions/models/venice/voice.test.ts src/shared/providers/definitions/models/venice/crypto-signature.test.ts src/shared/providers/definitions/models/venice/tee-policy.test.ts src/shared/providers/definitions/models/venice/tee-quote.test.ts src/shared/providers/definitions/models/venice/secure-chat.test.ts src/shared/providers/definitions/models/venice/privacy.test.ts src/shared/providers/definitions/models/venice/privacy-auto.test.ts src/shared/providers/definitions/models/venice/sound-effects.test.ts src/renderer/packages/venice/session-approvals.test.ts packages/chatbox-i18n/src/resources.test.ts src/renderer/packages/web-search/venice.test.ts src/renderer/packages/venice/image-model-choice.test.ts src/shared/providers/definitions/models/venice/media-capabilities.test.ts src/shared/providers/definitions/models/venice/music-catalog.test.ts src/shared/providers/definitions/models/venice/reasoning.test.ts src/shared/providers/definitions/models/venice/image-tools.test.ts src/shared/providers/definitions/models/venice/internal-mcp.test.ts src/shared/utils/reasoning-control.test.ts src/renderer/utils/request.test.ts src/renderer/packages/image-model-catalog.test.ts src/renderer/hooks/useImageModelGroups.test.tsx src/shared/providers/definitions/models/venice/catalog.test.ts src/shared/providers/definitions/models/venice/media.test.ts src/shared/providers/definitions/models/venice/options.test.ts src/shared/providers/definitions/models/venice/tools.test.ts src/shared/models/utils/extra-body.test.ts src/shared/providers/definitions/models/venice.test.ts packages/chatbox-core/src/application/image-generation/catalog.test.ts packages/chatbox-core/src/application/image-generation/ImageGenerationService.test.ts packages/chatbox-core/src/domain/settings/fork-privacy-defaults.test.ts src/renderer/packages/context-management/summary-generator.test.ts src/renderer/components/Markdown.ssr.test.tsx src/renderer/components/message-parts/ToolCallPartUI.search-results.test.tsx packages/chatbox-core/src/domain/settings/settings-migrations.test.ts packages/chatbox-core/src/application/settings/SettingsService.test.ts packages/chatbox-core/src/backup-host/settings.test.ts src/renderer/stores/settingsStore.persist.test.ts src/renderer/adapters/RendererSettingsStorage.test.ts
      - name: Session resource pagination, branches and deletion
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/shared/preview-images.test.ts src/renderer/packages/session-resources/service.test.ts
      - name: Markdown exports and global speech privacy
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/main/markdown-pdf.test.ts src/shared/speech.test.ts src/shared/speech-client.test.ts src/renderer/packages/markdown-export/standalone.test.ts src/renderer/routes/settings/-modelRigSettings.test.ts src/renderer/routes/settings/-default-models.test.ts src/renderer/components/speech/SpeechControls.test.tsx
      - name: Full unit test suite (optional)
        if: inputs.test_scope == 'unit'
        run: pnpm test:unit
      - name: Global search engine tools and new-chat speech
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/renderer/packages/web-search/index.test.ts src/renderer/packages/model-calls/toolsets/web-search.test.ts src/renderer/packages/tools/index.test.ts src/renderer/packages/speech/service.test.ts
      - name: Agent questions, failed generation decisions and session image previews
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/shared/user-questions.test.ts src/shared/generation-retry.test.ts src/renderer/packages/session-resources/tools.test.ts src/renderer/packages/model-calls/toolsets/view-image.test.ts
      - name: Collaboration identity, encryption and HITL permissions
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/shared/collaboration.test.ts src/shared/image-dimensions.test.ts src/renderer/packages/collaboration/bridge.test.ts src/renderer/packages/collaboration/crypto.test.ts src/renderer/packages/collaboration/hub.test.ts src/renderer/packages/collaboration/network.test.ts src/renderer/components/collaboration/PairingScanner.test.tsx src/renderer/components/collaboration/HitlCard.test.tsx
      - name: Full Venice catalog classification, pricing and failure reasons
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run src/shared/providers/definitions/models/venice/catalog-audit.test.ts src/shared/providers/definitions/models/venice/model-variant.test.ts src/shared/providers/definitions/models/venice/failure-reason.test.ts src/renderer/components/venice/VeniceModelCost.test.tsx src/shared/providers/definitions/models/venice/comparison-price.test.ts src/renderer/components/venice/VeniceModelInfo.test.tsx src/renderer/components/venice/VenicePrivacyStatus.test.tsx
      - name: Multi-agent permissions, guardians and subscription transport
        if: always() && inputs.test_scope != 'unit' && inputs.test_scope != 'ui'
        run: pnpm exec vitest run packages/chatbox-core/src/generation/stream-chunk-processor.test.ts src/renderer/components/ModelSelectorV2/SelectedModel.test.tsx src/shared/agent-output.test.ts src/shared/multi-agent-runtime.test.ts src/shared/multi-agent-description.test.ts src/shared/local-mcp-agents.test.ts src/renderer/packages/multi-agent/external.test.ts src/shared/oauth/chatgpt-subscription.test.ts src/shared/session-file-store.test.ts
      - name: Check private Android signing backup logic
        run: node --test scripts/fork-icon.test.mjs scripts/refresh-venice-media-reference.test.mjs scripts/android-signing.test.mjs scripts/android-signing-migration.test.mjs
      - name: Verify generated Android audio permissions
        run: node --test scripts/configure-fork-android.test.mjs scripts/collaboration-test/vendor.test.mjs


  ui:
    name: Simulated UI and browser checks
    if: inputs.test_scope != 'unit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        id: ui_dependencies
      - name: Simulated UI interactions and reference links
        run: pnpm exec vitest run src/renderer/components/session-resources/LocalMCPSettings.test.tsx src/renderer/components/Artifact.test.tsx src/renderer/components/session/SessionSidePanel.test.tsx src/renderer/components/session-resources/SessionResources.test.tsx src/renderer/components/session-resources/MarkdownFilePreview.test.tsx src/renderer/components/venice/VeniceChatPrivacySettings.test.tsx src/renderer/components/venice/SecureReceiptSettings.test.tsx src/renderer/components/venice/VeniceImageTools.test.tsx src/renderer/components/venice/VenicePricing.test.tsx src/renderer/components/InputBox/useModelToolCapabilities.test.tsx src/renderer/components/venice/VeniceSearchControl.test.tsx src/renderer/components/security/ProtectedPreviewGate.test.tsx src/renderer/components/common/AdaptiveModal.test.tsx src/renderer/components/security/CreationUnlock.test.tsx src/renderer/hooks/useInputBoxHistory.privacy.test.tsx src/renderer/routes/image-creator/-components/HistoryItem.test.tsx src/renderer/components/security/ProjectGate.test.tsx src/renderer/components/security/ScopeUnlock.test.tsx src/renderer/packages/local-library.test.ts src/renderer/components/session/SessionItem.test.tsx src/renderer/stores/session/crud.test.ts src/renderer/components/venice/VeniceMediaApproval.test.tsx src/renderer/components/venice/VeniceSessionApprovals.test.tsx src/renderer/components/venice/VeniceLocalization.test.tsx src/renderer/components/settings/provider/VeniceProfiles.test.tsx src/renderer/modals/ModelEdit.venice.test.tsx src/renderer/components/ImageModelSelect.test.tsx src/renderer/components/InputBox/AgentModePanel.test.tsx src/renderer/components/InputBox/MobileAgentModePanel.test.tsx src/renderer/components/venice/VeniceStudio.test.tsx src/renderer/components/venice/VeniceRecorder.test.tsx src/renderer/components/venice/VeniceImageApproval.test.tsx src/renderer/components/Markdown.ssr.test.tsx src/renderer/components/message-parts/ToolCallPartUI.search-results.test.tsx
      - name: Global web search settings
        run: pnpm exec vitest run src/renderer/components/settings/VeniceWebSearchSettings.test.tsx src/renderer/components/agent/UserQuestion.test.tsx
      - name: Browser simulation with desktop and phone screenshots
        if: always() && steps.ui_dependencies.outcome == 'success'
        run: |
          node scripts/build-mobile-work-worker.cjs
          node scripts/prepare-python-test-assets.mjs
          node scripts/ui-simulation/run.mjs
      - name: Install local TURN fixture
        if: always() && steps.ui_dependencies.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends coturn
      - name: Real WebRTC collaboration, permissions and shared HITL
        if: always() && steps.ui_dependencies.outcome == 'success'
        run: node scripts/collaboration-test/run.mjs
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Venice-UI-simulation
          path: test-results/venice-ui/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
