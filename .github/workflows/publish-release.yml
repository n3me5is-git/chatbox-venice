name: Publish existing build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run ID containing both successful packages
        type: string
        required: true
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-fork-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source, tests and package jobs
        id: source
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const run_id = Number(process.env.BUILD_RUN_ID)
            if (!Number.isSafeInteger(run_id) || run_id <= 0) throw new Error('Invalid build run ID')
            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id })
            if (run.path !== '.github/workflows/build-fork.yml' || run.head_branch !== 'main' ||
                run.head_repository.full_name !== context.repo.owner + '/' + context.repo.repo) {
              throw new Error('Release requires a build of this fork main branch')
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...repo, run_id, filter: 'latest' })
            for (const name of ['Package Windows x64 setup', 'Package Android APK']) {
              if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error(name + ' has not succeeded')
            }
            if (!jobs.some(job => job.name.endsWith('Validate and test') && job.conclusion === 'success')) {
              throw new Error('Required checks have not succeeded')
            }
            core.setOutput('sha', run.head_sha)
            const { data: versionFile } = await github.rest.repos.getContent({ ...repo, path: 'release/app/package.json', ref: run.head_sha })
            const version = JSON.parse(Buffer.from(versionFile.content, 'base64').toString()).version
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version')
            let publish = true
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({ ...repo, tag: 'v' + version })
              publish = existing.draft
            } catch (error) { if (error.status !== 404) throw error }
            core.setOutput('publish', String(publish))
            if (!publish) core.notice('Release v' + version + ' already published; leaving it unchanged')
      - uses: actions/checkout@v4
        if: steps.source.outputs.publish == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        if: steps.source.outputs.publish == 'true'
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.publish == 'true'
        with:
          pattern: Chatbox-Venice-*
          merge-multiple: true
          path: release/artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Publish versioned release with changelog and checksums
        if: steps.source.outputs.publish == 'true'
        run: node scripts/publish-fork-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}

