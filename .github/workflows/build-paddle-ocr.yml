name: PaddleOCR native runtime
on:
  push:
    branches: ['codex/paddle-ocr']
    paths: ['native/paddle-ocr/**', 'scripts/paddle-ocr/**', '.github/workflows/build-paddle-ocr.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paddle-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: models
        with:
          path: .cache/paddle-ocr/models
          key: ppocr-v5-latin-f32-20261020-${{ hashFiles('scripts/paddle-ocr/export-models.py') }}
      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
      - name: Install model conversion tools on runner only
        if: steps.models.outputs.cache-hit != 'true'
        run: python -m pip install numpy==1.26.4 paddlepaddle==3.0.0 paddle2onnx==2.1.0 onnx==1.17.0 onnxruntime==1.22.1
      - name: Export pinned detector and Latin recognizer
        if: steps.models.outputs.cache-hit != 'true'
        run: python scripts/paddle-ocr/export-models.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaddleOCR-models
          path: |
            .cache/paddle-ocr/models/*.ncnn.param
            .cache/paddle-ocr/models/*.ncnn.bin
            .cache/paddle-ocr/models/dictionary.json
            .cache/paddle-ocr/models/model-manifest.json
          retention-days: 7

  windows:
    needs: models
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PaddleOCR-models
          path: .cache/paddle-ocr/models
      - uses: actions/cache@v4
        with:
          path: .cache/paddle-ocr/sdk
          key: paddle-sdk-win-ncnn20261020-opencv38-json3120
      - name: Build isolated CPU/Vulkan recognition engine
        run: python scripts/paddle-ocr/build-runtime.py
      - name: Test native OCR and dynamic image sizes
        run: node scripts/paddle-ocr/test-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PaddleOCR-Windows
          path: |
            .cache/paddle-ocr/paddle-ocr-win-x64-v1.zip
            .cache/paddle-ocr/download-manifest.json
            test-results/paddle-ocr/
          retention-days: 7
      - name: Publish optional runtime component
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view paddle-ocr-runtime-v1 >/dev/null 2>&1 || gh release create paddle-ocr-runtime-v1 --target "$GITHUB_SHA" --prerelease --title "PaddleOCR local engine v1" --notes "Optional Windows x64 PaddleOCR text-recognition component with CPU and Vulkan support. Includes Latin language models and third-party license notices."
          gh release upload paddle-ocr-runtime-v1 .cache/paddle-ocr/paddle-ocr-win-x64-v1.zip .cache/paddle-ocr/download-manifest.json --clobber

  android:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PaddleOCR-models
          path: .cache/paddle-ocr/models
      - uses: actions/cache@v4
        with:
          path: .cache/paddle-ocr/android-sdk
          key: paddle-sdk-android-ncnn20261020-opencv38-json3120
      - name: Build Android CPU/Vulkan libraries
        run: python scripts/paddle-ocr/build-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaddleOCR-Android
          path: |
            .cache/paddle-ocr/paddle-ocr-android-v1.zip
            .cache/paddle-ocr/paddle-ocr-models-v1.zip
            .cache/paddle-ocr/android-download-manifest.json
          retention-days: 7
      - name: Publish Android components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view paddle-ocr-runtime-v1 >/dev/null 2>&1 || gh release create paddle-ocr-runtime-v1 --target "$GITHUB_SHA" --prerelease --title "PaddleOCR local engine v1" --notes "Optional local PaddleOCR components for Windows and Android, with CPU and Vulkan support and Latin language models."
          gh release upload paddle-ocr-runtime-v1 .cache/paddle-ocr/paddle-ocr-android-v1.zip .cache/paddle-ocr/paddle-ocr-models-v1.zip .cache/paddle-ocr/android-download-manifest.json --clobber
